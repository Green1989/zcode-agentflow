# Secret scanning — catch leaked credentials in CI before a public release.
#
# Uses gitleaks via the official gitleaks-action, pinned to a commit SHA. The
# scan runs on every push and PR. Test fixtures that intentionally contain
# secret-shaped strings (tests/unit/test_redact.py) are constructed to be
# scanner-safe (low-entropy sentinel values, not real credentials) so no global
# exemption is needed — a real leak would still be caught.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # fetch full history so gitleaks can scan all reachable commits, not
          # just the shallow checkout (a secret in an old commit still leaks).
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
