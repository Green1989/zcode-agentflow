# ZCode-AgentFlow — package metadata + build + tooling config
#
# Exact dependency versions are pinned in requirements.lock (the Phase 0 spike
# contract, P1-7). The bounds here are compatible-release anchors so a fresh
# `pip install -e .` stays close to validated versions; the authoritative
# install procedure (Task 1.1, P1-3) installs the lock first, then the package
# with --no-deps so pip cannot drift past the frozen versions:
#
#     pip install -r requirements.lock && pip install -e . --no-deps

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zcode-agentflow"
version = "0.1.0"
description = "ZCode-supervised AgentFlow: Codex planner + Grok reviewer, versioned-file handoff"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ZCode-AgentFlow contributors" }]
# Compatible-release bounds anchored to the validated + security-scanned versions.
# EXACT versions live in requirements.lock (the frozen contract).
dependencies = [
    "mcp>=1.29,<2",
    "portalocker>=2.10,<5.0",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Version Control :: Git",
]

# Public project URLs. This project ships as a ZCode plugin installed from a
# Git clone + local marketplace (see README); it is NOT published on PyPI, so
# no PyPI URLs are listed.
[project.urls]
Homepage = "https://github.com/Green1989/zcode-agentflow"
Repository = "https://github.com/Green1989/zcode-agentflow"
Documentation = "https://github.com/Green1989/zcode-agentflow/tree/main/docs"
Issues = "https://github.com/Green1989/zcode-agentflow/issues"

[project.optional-dependencies]
test = [
    "pytest~=9.0",
    "pytest-mock~=3.15",
]

[project.scripts]
zcode-agentflow = "zcode_agentflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Layer 3 (tests/smoke) uses the REAL Codex/Grok CLIs and is OFF by default —
# it is never collected by the default suite. Run it manually with
# AGENTFLOW_SMOKE=1 python tests/smoke/run_local_smoke.py (Task 8.3 / §21).
addopts = ["--ignore=tests/smoke"]
